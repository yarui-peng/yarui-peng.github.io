name: Build and deploy public site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'static/**'
      - 'shared/**'
      - 'dynamic/**'
      - '.github/workflows/public-site.yml'

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

defaults:
  run:
    working-directory: static

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static/dist

  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: static/dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-github-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
